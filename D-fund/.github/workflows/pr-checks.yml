name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Fast checks that must pass before review — no secrets required
  static:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Backend ──────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: D-fund/backend/package-lock.json

      - name: Install backend deps
        working-directory: D-fund/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: D-fund/backend
        run: npx prisma generate --schema=../prisma/schema.prisma

      - name: Backend lint
        working-directory: D-fund/backend
        run: npm run lint:check

      - name: Backend type-check
        working-directory: D-fund/backend
        run: npx tsc --noEmit

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Install frontend deps
        working-directory: D-fund/frontend
        run: npm ci

      - name: Frontend lint
        working-directory: D-fund/frontend
        run: npm run lint

      - name: Frontend type-check
        working-directory: D-fund/frontend
        run: npx tsc --noEmit
