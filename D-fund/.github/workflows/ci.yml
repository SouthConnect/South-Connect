name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Backend — lint, type-check, unit tests, E2E tests
  # ──────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      # Minimal secrets required to boot the NestJS app in test mode.
      # Real DB is needed for E2E — use a Supabase test project or
      # swap for a local Postgres service below.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}
      RESEND_API_KEY: ${{ secrets.TEST_RESEND_API_KEY }}

    defaults:
      run:
        working-directory: D-fund/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: D-fund/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=../prisma/schema.prisma

      - name: Lint
        run: npm run lint:check

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --passWithNoTests --forceExit --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --passWithNoTests --forceExit --testTimeout=30000
        env:
          NODE_ENV: test

  # ──────────────────────────────────────────────────────────────────────────────
  # Frontend — lint, type-check, Next.js build
  # ──────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: D-fund/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: D-fund/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-time env vars — non-sensitive placeholder values are fine for
          # type-checking the build; sensitive values come from secrets.
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api/v1' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Docker build — validate both images build correctly
  # Only runs on push to main (not on PRs) to avoid wasting build minutes
  # ──────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: D-fund

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./D-fund
          file: ./D-fund/backend/Dockerfile
          push: false
          tags: d-fund/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./D-fund
          file: ./D-fund/frontend/Dockerfile
          push: false
          tags: d-fund/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
