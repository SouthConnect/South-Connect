worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ──────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  # ── Performance ──────────────────────────────────────────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 10m;
  server_tokens off;

  # ── Gzip ─────────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml application/atom+xml image/svg+xml
    font/ttf font/opentype font/woff font/woff2;

  # ── Rate limiting zones ───────────────────────────────────────────────────────
  # Zone globale : 10 req/s par IP
  limit_req_zone $binary_remote_addr zone=global:10m rate=10r/s;
  # Zone auth : 2 req/s par IP (login, register, forgot-password)
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
  # Zone upload : 1 req/s par IP
  limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;

  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
  limit_conn conn_limit 50;

  # ── Proxy cache (assets statiques) ───────────────────────────────────────────
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m;
  proxy_cache_key "$scheme$request_method$host$request_uri";

  resolver 127.0.0.11 valid=30s ipv6=off;

  # ── Upstreams ─────────────────────────────────────────────────────────────────
  upstream backend {
    server backend:3001;
    keepalive 32;
  }

  upstream frontend {
    server frontend:3000;
    keepalive 32;
  }

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
  server {
    listen 80;
    server_name southconnect.io www.southconnect.io;

    # Laisser passer le health check Nginx (docker-compose)
    location = /health {
      access_log off;
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ─────────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name southconnect.io www.southconnect.io;

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_dhparam         /etc/nginx/ssl/dhparam.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Health (pour docker-compose healthcheck) ──────────────────────────────
    location = /health {
      access_log off;
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    # ── API backend ───────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=global burst=20 nodelay;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 60s;
    }

    # Auth endpoints : rate limit plus strict
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password) {
      limit_req zone=auth burst=5 nodelay;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload endpoint
    location /api/v1/storage/upload {
      limit_req zone=upload burst=3 nodelay;
      client_max_body_size 10m;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # ── WebSocket (Socket.IO) ─────────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # ── Next.js static assets (cache agressif) ───────────────────────────────
    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_cache static_cache;
      proxy_cache_valid 200 7d;
      add_header X-Cache-Status $upstream_cache_status;
      add_header Cache-Control "public, max-age=604800, immutable";
      access_log off;
    }

    location /favicon.ico {
      proxy_pass http://frontend;
      proxy_cache static_cache;
      proxy_cache_valid 200 1d;
      access_log off;
    }

    # ── Frontend (Next.js) ───────────────────────────────────────────────────
    location / {
      limit_req zone=global burst=30 nodelay;

      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
