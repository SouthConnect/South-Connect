version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Activer l'authentification Redis — REDIS_PASSWORD doit être défini dans l'env hôte
    command: >
      sh -c "redis-server --appendonly yes
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - >
          redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Job one-shot : applique les migrations Prisma avant de démarrer le backend.
  # Si les migrations échouent, le backend ne démarre pas.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
    entrypoint: ["npx", "prisma", "migrate", "deploy", "--schema=../prisma/schema.prisma"]
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - REDIS_URL=redis://${REDIS_PASSWORD:+:$REDIS_PASSWORD@}redis:6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
