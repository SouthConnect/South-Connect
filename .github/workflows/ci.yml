name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Gitleaks — scan des secrets dans le code avant tout autre job
  # ──────────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Runs the open-source gitleaks CLI directly (Apache-2.0, free) instead of
      # gitleaks/gitleaks-action, which added a mandatory GITLEAKS_LICENSE
      # requirement even for public repos in a recent breaking update.
      - name: Install and run gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose


  # ──────────────────────────────────────────────────────────────────────────────
  # Backend — lint, type-check, unit tests, E2E tests
  # ──────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: [secrets-scan]

    permissions:
      contents: read

    # Postgres éphémère et jetable, propre à ce run — évite de dépendre d'un
    # projet Supabase de test externe. Validé manuellement le 2026-08-05 :
    # les 20 migrations + la suite e2e applications passent en ~8s dessus.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only-ephemeral
          POSTGRES_DB: dfund_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Identifiants jetables d'un conteneur Postgres local au run — pas des
      # secrets, la base n'existe plus une fois le job terminé.
      DATABASE_URL: postgresql://postgres:ci-test-only-ephemeral@localhost:5432/dfund_test
      DIRECT_URL: postgresql://postgres:ci-test-only-ephemeral@localhost:5432/dfund_test
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      REFRESH_TOKEN_SECRET: ${{ secrets.TEST_REFRESH_TOKEN_SECRET }}
      # SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / RESEND_API_KEY volontairement
      # absents : storage.service.ts et email.service.ts dégradent proprement
      # (upload/email désactivés, aucune erreur) quand ils sont absents — testé
      # localement. Aucun test e2e actuel n'exerce l'upload de fichier ou ne
      # vérifie qu'un email a été envoyé. Éviter d'envoyer de vrais emails ou
      # de dépendre d'un bucket Supabase à chaque run de CI.

    defaults:
      run:
        working-directory: D-fund/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: D-fund/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=../prisma/schema.prisma

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=../prisma/schema.prisma

      - name: Lint
        run: npm run lint:check

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --passWithNoTests --forceExit --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --forceExit --testTimeout=30000
        env:
          NODE_ENV: test

  # ──────────────────────────────────────────────────────────────────────────────
  # Frontend — lint, type-check, Next.js build
  # ──────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [secrets-scan]

    permissions:
      contents: read

    defaults:
      run:
        working-directory: D-fund/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: D-fund/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api/v1' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Playwright E2E — smoke tests (pages publiques, CSP, redirections auth)
  # ──────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]

    permissions:
      contents: read

    env:
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      STAGING_URL: ${{ secrets.STAGING_URL }}

    defaults:
      run:
        working-directory: D-fund/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: D-fund/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api/v1' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}

      - name: Start Next.js (production)
        run: npm start &
        env:
          PORT: 3000
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api/v1' }}

      - name: Wait for Next.js to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright smoke tests
        run: npx playwright test tests/e2e/smoke/
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Run full E2E suite (staging)
        if: env.TEST_EMAIL != '' && env.STAGING_URL != ''
        run: npx playwright test --ignore=tests/e2e/smoke/
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_APPLICATION_ID: ${{ secrets.TEST_APPLICATION_ID }}
          TEST_PROFILE_ID: ${{ secrets.TEST_PROFILE_ID }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: D-fund/frontend/playwright-report/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────────
  # Docker build — validate both images build correctly
  # Only runs on push to main (not on PRs) to avoid wasting build minutes
  # ──────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    defaults:
      run:
        working-directory: D-fund

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./D-fund
          file: ./D-fund/backend/Dockerfile
          push: false
          tags: d-fund/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./D-fund
          file: ./D-fund/frontend/Dockerfile
          push: false
          tags: d-fund/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy — déclenche Railway et Vercel, mais seulement si tout ce qui précède
  # (secrets, backend, frontend, build Docker) a réussi. Avant ce job, Railway et
  # Vercel étaient branchés directement sur le repo GitHub et déployaient sur
  # chaque push vers main indépendamment du résultat de la CI — un échec ne
  # bloquait rien. Ce job remplace ce déclenchement automatique natif par un
  # déclenchement explicite, gardé par `needs`.
  #
  # Nécessite deux secrets GitHub (Settings → Secrets and variables → Actions) :
  #   - VERCEL_DEPLOY_HOOK_URL : créé dans Vercel → Project Settings → Git →
  #     Deploy Hooks (choisir la branche main). URL à usage unique, révocable,
  #     ne donne aucun accès au-delà de "déclencher un déploiement".
  #   - RAILWAY_TOKEN : créé dans Railway → Project Settings → Tokens
  #     (jeton de niveau projet, pas de compte).
  #
  # Tant que ces deux secrets ne sont pas configurés ET que le déploiement
  # automatique natif n'est pas désactivé côté Railway/Vercel (dashboards,
  # pas de config par fichier possible pour Railway), les deux mécanismes
  # coexistent : rien ne casse, mais la CI ne bloque encore rien réellement.
  # ──────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (Railway + Vercel)
    runs-on: ubuntu-latest
    needs: [secrets-scan, backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Deploy frontend (Vercel)
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL n'est pas configuré (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -sf -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

      - name: Deploy backend (Railway)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN n'est pas configuré (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          npm install -g @railway/cli
          # Nom de service confirmé le 20 août 2026 (tableau de bord Railway) : insightful-vision
          railway up --service insightful-vision --detach
